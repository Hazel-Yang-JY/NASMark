[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nasmark"
version = "0.1.0"
description = "Watermark-aware neural architecture search with SPOS MobileNet"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=1.13",
    "torchvision>=0.14",
]

[tool.setuptools.packages.find]
include = ["nasmark*"]

